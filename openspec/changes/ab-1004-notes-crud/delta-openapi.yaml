openapi: 3.1.0
info:
  title: Note Taking App API (AB-1004 delta)
  version: 0.1.0
  description: |
    Delta for ticket AB-1004 (notes CRUD and soft delete). Merged into
    docs/api/openapi.yaml when the change is archived. Statuses and error
    codes are binding (docs/SDS.md sections 4.3 and 7.1). References to
    ErrorResponse, PaginationMeta, the shared responses and bearerAuth
    resolve against docs/api/openapi.yaml.
servers:
  - url: /api/v1
paths:
  /notes:
    post:
      operationId: createNote
      summary: Create a note
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/trash:
    get:
      operationId: listTrashedNotes
      summary: List soft-deleted notes still restorable
      description: |
        Notes with `deletedAt > now - 30 days`, newest deletion first.
        Registered before `/notes/{noteId}`.
      tags: [notes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of trashed notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      summary: Read an own, active note
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateNote
      summary: Update a note's title and/or content
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteNote
      summary: Soft-delete a note
      description: Sets `deletedAt` only. An already-deleted note gives 404 and keeps its `deletedAt`.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Note moved to the trash. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      operationId: restoreNote
      summary: Restore a trashed note within 30 days
      description: Clears `deletedAt` only if `deletedAt > now - 30 days`; otherwise 404.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    NoteNotFound:
      description: Note missing, not owned, soft-deleted, or not restorable (NOTE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TipTapDoc:
      type: object
      description: |
        TipTap document limited to the allow-list in docs/SDS.md 8.1
        (node types, marks, attributes, depth at most 20). Serialised size
        at most 512,000 bytes.
      required: [type]
      properties:
        type:
          const: doc
        content:
          type: array
          items:
            type: object
    NoteCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation.
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: At least one of `title` and `content`.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteResponse:
      type: object
      required: [id, title, content, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          $ref: '#/components/schemas/TipTapDoc'
        tags:
          type: array
          description: Always empty until AB-1006 adds tags (TagResponse).
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrashListItem:
      type: object
      required: [id, title, preview, deletedAt, purgeAt, daysRemaining]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        preview:
          type: string
          maxLength: 150
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: deletedAt + 30 days.
        daysRemaining:
          type: integer
          minimum: 0
          description: Whole days until purgeAt, rounded up.
    TrashListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrashListItem'
