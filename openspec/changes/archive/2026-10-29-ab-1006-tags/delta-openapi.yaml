openapi: 3.1.0
info:
  title: Note Taking App API (AB-1006 delta)
  version: 0.1.0
  description: |
    Delta for ticket AB-1006. It adds only the tag endpoints and the note-tag
    replacement endpoint (docs/SDS.md section 7.1, rows 15 to 19). It is merged
    into docs/api/openapi.yaml when the change is archived (docs/SDS.md SA-44).
    Statuses and error codes are binding (docs/SDS.md sections 4.3 and 7.1).
    `NoteResponse` is introduced by AB-1004; this ticket fills its `tags`.
servers:
  - url: /api/v1
paths:
  /tags:
    get:
      operationId: listTags
      summary: List the caller's tags with note counts
      description: |
        Every tag of the caller, not paginated (SDS SA-25). `noteCount` counts
        only the caller's non-deleted notes (AC-TAG-05, AC-TAG-06).
      tags: [tags]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTag
      summary: Create a tag
      description: |
        Name unique per user ignoring case (`nameKey`, AC-TAG-02). Colour
        defaults to `#6B7280` (AC-TAG-03).
      tags: [tags]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The caller already has a tag with this name in any letter case (TAG_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTag
      summary: Rename or recolour a tag
      description: At least one of `name` or `color`. Visible on every note using the tag (AC-TAG-09).
      tags: [tags]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: Tag updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          description: Another tag of the caller already has this name in any letter case (TAG_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: Detaches the tag from all notes; no note is changed (AC-TAG-08).
      tags: [tags]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tag deleted. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/tags:
    put:
      operationId: setNoteTags
      summary: Replace the tags of a note
      description: |
        Replaces the whole tag set in one transaction (AC-TAG-07). Duplicate ids
        are removed, then at most 10 remain. Does not change `updatedAt` and
        creates no version (SDS SA-24).
      tags: [tags]
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNoteTagsRequest'
      responses:
        '200':
          description: The note with its new tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            The note is missing, not owned or soft-deleted (NOTE_NOT_FOUND), or
            a tag id is missing or not owned (TAG_NOT_FOUND). The note is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    TagCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Trimmed before validation.
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Defaults to `#6B7280`.
    TagUpdateRequest:
      type: object
      minProperties: 1
      description: At least one of `name` or `color`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Trimmed before validation.
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    TagResponse:
      type: object
      required: [id, name, color, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        createdAt:
          type: string
          format: date-time
    TagWithCount:
      type: object
      description: '`TagResponse` plus `noteCount`.'
      required: [id, name, color, createdAt, noteCount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        createdAt:
          type: string
          format: date-time
        noteCount:
          type: integer
          minimum: 0
          description: Caller's non-deleted notes carrying this tag.
    TagListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagWithCount'
    SetNoteTagsRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          description: |
            Duplicates are removed, then at most 10 ids are allowed (so no
            `maxItems` on the raw array). Empty removes all tags.
          items:
            type: string
            format: uuid
  responses:
    TagNotFound:
      description: Tag missing or owned by another user (TAG_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
