# Serves the built SPA and proxies /api to the backend service (docker-compose.yml, profile full).
# The browser talks only to this server, so its origin (http://localhost:8080) is the one the
# backend's APP_ORIGIN check expects, and the refresh cookie stays same-site.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Above the backend's 1 MB JSON limit, so an oversized body gets the API's JSON 413, not nginx's.
  client_max_body_size 2m;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    # Resolve at request time so nginx starts even if the backend is still booting.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Set-Cookie and Origin pass through untouched.
  }

  # Vite emits content-hashed file names under /assets.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
