openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.1.0
  summary: REST API of the Note Taking App (health, auth, password-reset and notes endpoints so far).
  description: |
    OpenAPI 3.1 document. It defines what every endpoint shares: the server
    base path, the security schemes and the binding error contract
    (docs/SDS.md Section 4).

    `paths` grows ticket by ticket. Each ticket describes its endpoints in its
    own `openspec/changes/<change>/delta-openapi.yaml`, which is merged into
    this file when the change is archived (docs/SDS.md SA-44). AB-1001 added
    `GET /health`. AB-1002 added the four auth endpoints. AB-1003 added forgot-password and reset-password. AB-1004 added notes CRUD, trash and restore. The executable request and response contracts are the Zod
    schemas in `packages/shared`.
servers:
  - url: /api/v1
    description: Same-origin API base path (SDS SA-01)
tags:
  - name: health
  - name: auth
  - name: notes
  - name: tags
  - name: search
  - name: shares
  - name: public
  - name: versions
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 while the process is serving requests. It does not query the database (SDS SA-29, SA-54).
      tags: [health]
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: register
      summary: Register and log in
      description: |
        Creates the user and logs them in. Sets the `refresh_token` cookie.
        The email is trimmed and stored in lower case (AC-AUTH-02).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email is already registered, in any letter case (EMAIL_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: |
        Returns an access token (15 minutes) and sets the `refresh_token`
        cookie (7 days). Wrong email and wrong password give the same error
        (AC-AUTH-10).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: |
        Uses the `refresh_token` cookie. The presented token is revoked and a
        new one is set (rotation, AC-AUTH-07). Presenting a token that was
        already rotated (replaced by a newer token) revokes every active
        refresh token of that user first (AC-AUTH-12). A token revoked by
        logout, an unknown token and an expired token revoke nothing.
        A present `Origin` header must equal the app origin.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token and rotated cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            Refresh cookie missing, unknown, expired, revoked or already used
            (INVALID_REFRESH_TOKEN). The cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: |
        Revokes the presented refresh token if it exists and is active, clears
        the cookie, and always answers 204 (ERR-AUTH-06). Other sessions of the
        user stay signed in. A present `Origin` header must equal the app origin.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logged out. The cookie is cleared. No body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password-reset OTP
      description: |
        For an existing account, generates a 6-digit OTP valid for 10 minutes
        and delivers it to the server console (AC-PWD-03, AC-PWD-10). Any
        earlier unused OTP of the account is invalidated (AC-PWD-05). The
        response is identical whether or not the email belongs to an account
        (AC-PWD-02), and also when delivery fails.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Request accepted. No body, the same for a known and an unknown email.
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with an OTP
      description: |
        On a correct, usable OTP, stores the new password, marks the OTP used
        and revokes every refresh token of the user in one transaction
        (AC-PWD-08). The user is not logged in: no cookie and no token are
        returned. A wrong, expired, used, invalidated or unknown-account OTP
        gives one error, `OTP_INVALID_OR_EXPIRED`, so nothing leaks
        (ERR-PWD-02 to 07). The fifth wrong attempt invalidates the OTP
        (AC-PWD-07). The new password is validated before the OTP is read, so
        a weak password does not count as an attempt (ERR-PWD-05).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed. No body, no cookie.
        '400':
          description: |
            Either the request failed validation (VALIDATION_ERROR, with
            `details`) or the OTP was not accepted (OTP_INVALID_OR_EXPIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes:
    post:
      operationId: createNote
      summary: Create a note
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/trash:
    get:
      operationId: listTrashedNotes
      summary: List soft-deleted notes still restorable
      description: |
        Notes with `deletedAt > now - 30 days`, newest deletion first.
        Registered before `/notes/{noteId}`.
      tags: [notes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of trashed notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      summary: Read an own, active note
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateNote
      summary: Update a note's title and/or content
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteNote
      summary: Soft-delete a note
      description: Sets `deletedAt` only. An already-deleted note gives 404 and keeps its `deletedAt`.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Note moved to the trash. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      operationId: restoreNote
      summary: Restore a trashed note within 30 days
      description: Clears `deletedAt` only if `deletedAt > now - 30 days`; otherwise 404.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    SetRefreshCookie:
      description: |
        `refresh_token=<opaque>; HttpOnly; SameSite=Strict; Path=/api/v1/auth;
        Max-Age=604800`, plus `Secure` in production. The only place the
        refresh token is delivered (SDS SA-03).
      schema:
        type: string
    ClearRefreshCookie:
      description: The same cookie with an empty value and `Max-Age=0`.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, valid 15 minutes. Kept in memory by the client.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Opaque refresh token, HttpOnly, SameSite=Strict, Path=/api/v1/auth,
        valid 7 days. Used only by /auth/refresh and /auth/logout.
  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    PublicUser:
      type: object
      required: [id, email, displayName, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before validation and storage.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit (AC-AUTH-03).
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed. Optional.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: No strength rule on login.
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before lookup.
    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before lookup.
        otp:
          type: string
          pattern: '^\d{6}$'
          description: The 6-digit code from the console log.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit (AC-AUTH-03).
    AuthResponse:
      type: object
      required: [user, accessToken, expiresIn]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string
          description: HS256 JWT, issuer `note-app`, audience `note-app-api`. Keep in memory only.
        expiresIn:
          type: integer
          enum: [900]
          description: Access token lifetime in seconds.
    TipTapDoc:
      type: object
      description: |
        TipTap document limited to the allow-list in docs/SDS.md 8.1
        (node types, marks, attributes, depth at most 20). Serialised size
        at most 512,000 bytes.
      required: [type]
      properties:
        type:
          const: doc
        content:
          type: array
          items:
            type: object
    NoteCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation.
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: At least one of `title` and `content`.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteResponse:
      type: object
      required: [id, title, content, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          $ref: '#/components/schemas/TipTapDoc'
        tags:
          type: array
          description: Always empty until AB-1006 adds tags (TagResponse).
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrashListItem:
      type: object
      required: [id, title, preview, deletedAt, purgeAt, daysRemaining]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        preview:
          type: string
          maxLength: 150
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: deletedAt + 30 days.
        daysRemaining:
          type: integer
          minimum: 0
          description: Whole days until purgeAt, rounded up.
    TrashListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrashListItem'
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `message`.
      enum:
        - VALIDATION_ERROR
        - MALFORMED_JSON
        - OTP_INVALID_OR_EXPIRED
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - FORBIDDEN_ORIGIN
        - ROUTE_NOT_FOUND
        - NOTE_NOT_FOUND
        - TAG_NOT_FOUND
        - VERSION_NOT_FOUND
        - SHARE_LINK_NOT_FOUND
        - EMAIL_TAKEN
        - TAG_NAME_TAKEN
        - VERSION_ALREADY_CURRENT
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the invalid field, for example `content.content.0.type`.
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Short, human-readable, safe to display. Never contains stack traces or internal detail.
            details:
              type: array
              description: Present only for VALIDATION_ERROR.
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: Value of the X-Request-Id response header.
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
  responses:
    Unauthorized:
      description: Access token missing, malformed, invalid or expired (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenOrigin:
      description: The `Origin` header is present and is not the app origin (FORBIDDEN_ORIGIN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Body, query or path parameter failed validation (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoteNotFound:
      description: Note missing, not owned, soft-deleted, or not restorable (NOTE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
