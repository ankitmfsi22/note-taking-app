openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.1.0
  summary: REST API of the Note Taking App, all 28 endpoints (health, auth, password reset, notes, tags, search, sharing, version history).
  description: |
    OpenAPI 3.1 document for every endpoint in docs/SDS.md section 7.1. The
    backend serves it as Swagger UI at `/api/docs` and as JSON at
    `/api/docs/openapi.json` when `API_DOCS_ENABLED` is true.

    **Try it out.** Call `POST /auth/login` (or `/auth/register`), copy the
    `accessToken`, click Authorize and paste it into `bearerAuth`. The refresh
    cookie is `HttpOnly`, so the browser sends it by itself to
    `/auth/refresh` and `/auth/logout` and Swagger UI never shows it.

    **Errors.** Every non-2xx response has the same body,
    `{ "error": { "code", "message", "details?", "requestId" } }`, with the
    binding codes of docs/SDS.md section 4.3. Ownership failures are `404`,
    never `403`.

    The executable request and response contracts are the Zod schemas in
    `packages/shared`; a test fails if a registered route is missing here.
servers:
  - url: /api/v1
    description: Same-origin API base path (SDS SA-01)
tags:
  - name: health
    description: Liveness check.
  - name: auth
    description: Registration, login, token rotation, logout and password reset.
  - name: notes
    description: Rich-text notes, listing, trash and restore.
  - name: tags
    description: Per-user tags and note tagging.
  - name: search
    description: Full-text search over the caller's notes.
  - name: shares
    description: Public read-only share links, managed by the owner.
  - name: public
    description: Anonymous endpoints.
  - name: versions
    description: Version history and restore.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 while the process is serving requests. It does not query the database (SDS SA-29, SA-54).
      tags: [health]
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: register
      summary: Register and log in
      description: |
        Creates the user and logs them in. Sets the `refresh_token` cookie.
        The email is trimmed and stored in lower case (AC-AUTH-02).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email is already registered, in any letter case (EMAIL_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: |
        Returns an access token (15 minutes) and sets the `refresh_token`
        cookie (7 days). Wrong email and wrong password give the same error
        (AC-AUTH-10).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: |
        Uses the `refresh_token` cookie. The presented token is revoked and a
        new one is set (rotation, AC-AUTH-07). Presenting a token that was
        already rotated (replaced by a newer token) revokes every active
        refresh token of that user first (AC-AUTH-12). A token revoked by
        logout, an unknown token and an expired token revoke nothing.
        A present `Origin` header must equal the app origin (`APP_ORIGIN`), so
        "Try it out" in Swagger UI gets `403 FORBIDDEN_ORIGIN` unless
        `APP_ORIGIN` is the origin serving the docs.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token and rotated cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            Refresh cookie missing, unknown, expired, revoked or already used
            (INVALID_REFRESH_TOKEN). The cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: |
        Revokes the presented refresh token if it exists and is active, clears
        the cookie, and always answers 204 (ERR-AUTH-06). Other sessions of the
        user stay signed in. A present `Origin` header must equal the app origin
        (`APP_ORIGIN`), so "Try it out" in Swagger UI gets `403 FORBIDDEN_ORIGIN`
        unless `APP_ORIGIN` is the origin serving the docs.
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logged out. The cookie is cleared. No body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password-reset OTP
      description: |
        For an existing account, generates a 6-digit OTP valid for 10 minutes
        and delivers it to the server console (AC-PWD-03, AC-PWD-10). Any
        earlier unused OTP of the account is invalidated (AC-PWD-05). The
        response is identical whether or not the email belongs to an account
        (AC-PWD-02), and also when delivery fails.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Request accepted. No body, the same for a known and an unknown email.
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with an OTP
      description: |
        On a correct, usable OTP, stores the new password, marks the OTP used
        and revokes every refresh token of the user in one transaction
        (AC-PWD-08). The user is not logged in: no cookie and no token are
        returned. A wrong, expired, used, invalidated or unknown-account OTP
        gives one error, `OTP_INVALID_OR_EXPIRED`, so nothing leaks
        (ERR-PWD-02 to 07). The fifth wrong attempt invalidates the OTP
        (AC-PWD-07). The new password is validated before the OTP is read, so
        a weak password does not count as an attempt (ERR-PWD-05).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed. No body, no cookie.
        '400':
          description: |
            Either the request failed validation (VALIDATION_ERROR, with
            `details`) or the OTP was not accepted (OTP_INVALID_OR_EXPIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes:
    get:
      operationId: listNotes
      summary: List the caller's notes
      description: |
        Returns the caller's non-deleted notes, paginated (AC-LIST-01,
        AC-LIST-02). Sorted by `sortBy` and `sortOrder`, ties broken by `id`
        (AC-LIST-03, AC-LIST-04). `tagIds` filters with OR, each note once
        (AC-LIST-05). A page beyond the last returns empty `items` with
        correct totals (AC-LIST-07). Any `tagIds` entry that is missing or
        not the caller's gives `404 TAG_NOT_FOUND` (AC-LIST-08).
      tags: [notes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [updatedAt, createdAt, title]
            default: updatedAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: tagIds
          in: query
          required: false
          description: Comma-separated tag UUIDs, at most 10 after duplicates are removed (SDS SA-26).
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: One page of note list items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: A `tagIds` entry does not exist or belongs to another user (TAG_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createNote
      summary: Create a note
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/trash:
    get:
      operationId: listTrashedNotes
      summary: List soft-deleted notes still restorable
      description: |
        Notes with `deletedAt > now - 30 days`, newest deletion first.
        Registered before `/notes/{noteId}`.
      tags: [notes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of trashed notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      summary: Read an own, active note
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateNote
      summary: Update a note's title and/or content
      tags: [notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteNote
      summary: Soft-delete a note
      description: Sets `deletedAt` only. An already-deleted note gives 404 and keeps its `deletedAt`.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Note moved to the trash. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      operationId: restoreNote
      summary: Restore a trashed note within 30 days
      description: Clears `deletedAt` only if `deletedAt > now - 30 days`; otherwise 404.
      tags: [notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/shares:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      operationId: createShareLink
      summary: Create a public share link for a note
      description: |
        Creates a link for the caller's non-deleted note (AC-SHARE-01). A note
        may have several links (AC-SHARE-02). The token is 32 random bytes as
        base64url (AC-SHARE-03). `expiresAt` is optional, in the future and at
        most 365 days ahead (AC-SHARE-04, ERR-SHARE-02). A missing, another
        user's or soft-deleted note is NOTE_NOT_FOUND (ERR-SHARE-01).
      tags: [shares]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: Link created. The token is returned so the owner can copy the link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listNoteShareLinks
      summary: List all links of one note
      description: All statuses, with creation time, expiry, view count and status (AC-SHARE-09, AC-SHARE-11).
      tags: [shares]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every link of the note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /shares:
    get:
      operationId: listActiveShareLinks
      summary: List the caller's active links across all notes
      description: |
        Paginated. Excludes revoked, expired and soft-deleted-note links
        (AC-SHARE-11, SA-17).
      tags: [shares]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of active links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveShareLinkListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /shares/{shareId}/revoke:
    post:
      operationId: revokeShareLink
      summary: Revoke a share link (idempotent)
      description: |
        Sets `revokedAt` only when it is null. Revoking an already revoked link
        returns 200 and changes nothing (AC-SHARE-10, ERR-SHARE-04). Other links
        of the note are untouched (AC-SHARE-02). A missing or another user's
        link is SHARE_LINK_NOT_FOUND (ERR-SHARE-03).
      tags: [shares]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShareId'
      responses:
        '200':
          description: The link after revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/shares/{token}:
    get:
      operationId: getPublicSharedNote
      summary: Read a shared note without logging in
      description: |
        Public and read-only (AC-SHARE-05). Any Authorization header is ignored
        (ERR-SHARE-09). One `UPDATE ... RETURNING` checks availability,
        increments the view count by exactly 1 and returns the note
        (AC-SHARE-07, SDS 8.3). Unknown, revoked, expired and deleted-note links
        are the same 404 and count nothing (AC-SHARE-14, ERR-SHARE-05 to 07).
      tags: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Title, content and last-updated time only (AC-SHARE-06).
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Robots-Tag:
              schema:
                type: string
                enum: [noindex]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSharedNote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/versions:
    get:
      operationId: listNoteVersions
      summary: List the retained versions of a note, newest first
      description: |
        Returns `versionNumber`, `title` and `createdAt` only, newest first,
        paginated (AC-VER-05). A missing, another user's or soft-deleted note
        is `404 NOTE_NOT_FOUND` (ERR-VER-01).
      tags: [versions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/versions/{versionNumber}:
    get:
      operationId: getNoteVersion
      summary: View one version, read-only
      description: Full title and content of a retained version (AC-VER-06).
      tags: [versions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Note missing, not owned or soft-deleted (NOTE_NOT_FOUND), or the
            version number is missing or purged (VERSION_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/versions/{versionNumber}/restore:
    post:
      operationId: restoreNoteVersion
      summary: Restore a version as a new latest version
      description: |
        In one transaction with a row lock on the note, sets the note to the
        version's title and content and creates a new version; existing
        versions are not changed (AC-VER-07, AC-VER-11). A target equal to
        the current title and content is `409 VERSION_ALREADY_CURRENT`
        (ERR-VER-03, SDS SA-20).
      tags: [versions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Note missing, not owned or soft-deleted (NOTE_NOT_FOUND), or the
            version number is missing or purged (VERSION_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The version equals the note's current title and content (VERSION_ALREADY_CURRENT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /search:
    get:
      operationId: searchNotes
      summary: Full-text search over the caller's notes
      description: |
        PostgreSQL full-text search (`plainto_tsquery('english')`) over the
        title and content text of the caller's non-deleted notes
        (AC-SRCH-01 to 03). Ordered by relevance (title above content), then
        `updatedAt` descending, then `id` (AC-SRCH-04). Operator characters
        are plain text (AC-SRCH-10). No match gives empty `items`
        (AC-SRCH-09). `titleHighlight` and `snippet` are HTML-escaped except
        for `<mark>` and `</mark>` (AC-SRCH-05, AC-SRCH-06).
      tags: [search]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Trimmed, then 2 to 200 characters (AC-SRCH-08).
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of results. A page beyond the end has empty `items` and correct totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags:
    get:
      operationId: listTags
      summary: List the caller's tags with note counts
      description: |
        Every tag of the caller, not paginated (SDS SA-25). `noteCount` counts
        only the caller's non-deleted notes (AC-TAG-05, AC-TAG-06).
      tags: [tags]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTag
      summary: Create a tag
      description: |
        Name unique per user ignoring case (`nameKey`, AC-TAG-02). Colour
        defaults to `#6B7280` (AC-TAG-03).
      tags: [tags]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The caller already has a tag with this name in any letter case (TAG_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    patch:
      operationId: updateTag
      summary: Rename or recolour a tag
      description: At least one of `name` or `color`. Visible on every note using the tag (AC-TAG-09).
      tags: [tags]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: Tag updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          description: Another tag of the caller already has this name in any letter case (TAG_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: Detaches the tag from all notes; no note is changed (AC-TAG-08).
      tags: [tags]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tag deleted. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}/tags:
    put:
      operationId: setNoteTags
      summary: Replace the tags of a note
      description: |
        Replaces the whole tag set in one transaction (AC-TAG-07). Duplicate ids
        are removed, then at most 10 remain. Does not change `updatedAt` and
        creates no version (SDS SA-24).
      tags: [tags]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNoteTagsRequest'
      responses:
        '200':
          description: The note with its new tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            The note is missing, not owned or soft-deleted (NOTE_NOT_FOUND), or
            a tag id is missing or not owned (TAG_NOT_FOUND). The note is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      description: Note id (UUID).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ShareId:
      name: shareId
      in: path
      required: true
      description: Share link id (UUID).
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      description: Tag id (UUID).
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: The 256-bit base64url share token (43 characters).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  headers:
    SetRefreshCookie:
      description: |
        `refresh_token=<opaque>; HttpOnly; SameSite=Strict; Path=/api/v1/auth;
        Max-Age=604800`, plus `Secure` in production. The only place the
        refresh token is delivered (SDS SA-03).
      schema:
        type: string
    ClearRefreshCookie:
      description: The same cookie with an empty value and `Max-Age=0`.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, valid 15 minutes. Kept in memory by the client.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Opaque refresh token, HttpOnly, SameSite=Strict, Path=/api/v1/auth,
        valid 7 days. Used only by /auth/refresh and /auth/logout.
  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    PublicUser:
      type: object
      required: [id, email, displayName, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password]
      examples:
        - email: ada@example.com
          password: correct-horse-1
          displayName: Ada
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before validation and storage.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit (AC-AUTH-03).
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed. Optional.
    LoginRequest:
      type: object
      required: [email, password]
      examples:
        - email: ada@example.com
          password: correct-horse-1
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: No strength rule on login.
    ForgotPasswordRequest:
      type: object
      required: [email]
      examples:
        - email: ada@example.com
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before lookup.
    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword]
      examples:
        - email: ada@example.com
          otp: '123456'
          newPassword: new-horse-battery-2
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased before lookup.
        otp:
          type: string
          pattern: '^\d{6}$'
          description: The 6-digit code from the console log.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit (AC-AUTH-03).
    AuthResponse:
      type: object
      required: [user, accessToken, expiresIn]
      additionalProperties: false
      examples:
        - user:
            id: 0190b0a0-0000-7000-8000-000000000001
            email: ada@example.com
            displayName: Ada
            createdAt: '2026-10-29T10:00:00.000Z'
          accessToken: example-access-token-not-a-real-jwt
          expiresIn: 900
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string
          description: HS256 JWT, issuer `note-app`, audience `note-app-api`. Keep in memory only.
        expiresIn:
          type: integer
          enum: [900]
          description: Access token lifetime in seconds.
    TipTapDoc:
      type: object
      description: |
        TipTap document limited to the allow-list in docs/SDS.md 8.1
        (node types, marks, attributes, depth at most 20). Serialised size
        at most 512,000 bytes.
      required: [type]
      properties:
        type:
          const: doc
        content:
          type: array
          items:
            type: object
    NoteCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      examples:
        - title: Groceries
          content:
            type: doc
            content:
              - type: paragraph
                content:
                  - type: text
                    text: Milk, eggs, bread
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation.
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      examples:
        - title: Groceries (updated)
      description: At least one of `title` and `content`.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: '#/components/schemas/TipTapDoc'
    NoteResponse:
      type: object
      required: [id, title, content, tags, latestVersion, createdAt, updatedAt]
      examples:
        - id: 0190b0a0-0000-7000-8000-000000000002
          title: Groceries
          content:
            type: doc
            content:
              - type: paragraph
                content:
                  - type: text
                    text: Milk, eggs, bread
          tags:
            - id: 0190b0a0-0000-7000-8000-000000000003
              name: home
              color: '#6B7280'
              createdAt: '2026-10-29T10:00:00.000Z'
          latestVersion: 1
          createdAt: '2026-10-29T10:00:00.000Z'
          updatedAt: '2026-10-29T10:00:00.000Z'
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          $ref: '#/components/schemas/TipTapDoc'
        tags:
          type: array
          description: The note's tags, ordered by name (AB-1006).
          items:
            $ref: '#/components/schemas/TagResponse'
        latestVersion:
          type: integer
          minimum: 1
          description: The note's latest version number (`Note.lastVersionNumber`, AB-1009).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrashListItem:
      type: object
      required: [id, title, preview, deletedAt, purgeAt, daysRemaining]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        preview:
          type: string
          maxLength: 150
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: deletedAt + 30 days.
        daysRemaining:
          type: integer
          minimum: 0
          description: Whole days until purgeAt, rounded up.
    TrashListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrashListItem'
    TagResponse:
      type: object
      required: [id, name, color, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 30
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        createdAt:
          type: string
          format: date-time
    TagCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      examples:
        - name: home
          color: '#6B7280'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Trimmed before validation.
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Defaults to `#6B7280`.
    TagUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      examples:
        - color: '#2563EB'
      description: At least one of `name` or `color`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Trimmed before validation.
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    TagWithCount:
      type: object
      description: '`TagResponse` plus `noteCount`.'
      required: [id, name, color, createdAt, noteCount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        createdAt:
          type: string
          format: date-time
        noteCount:
          type: integer
          minimum: 0
          description: Caller's non-deleted notes carrying this tag.
    TagListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagWithCount'
    SetNoteTagsRequest:
      type: object
      required: [tagIds]
      additionalProperties: false
      examples:
        - tagIds:
            - 0190b0a0-0000-7000-8000-000000000003
      properties:
        tagIds:
          type: array
          description: |
            Duplicates are removed, then at most 10 ids are allowed (so no
            `maxItems` on the raw array). Empty removes all tags.
          items:
            type: string
            format: uuid
    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      examples:
        - expiresAt: '2026-12-31T23:59:59.000Z'
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Optional ISO 8601 datetime, in the future and at most 365 days ahead. Omitted means the link lasts until revoked.
    ShareLinkStatus:
      type: string
      enum: [active, expired, revoked]
      description: Derived from revokedAt and expiresAt with the injected clock (SDS 8.3).
    ShareLinkResponse:
      type: object
      required: [id, noteId, token, expiresAt, revokedAt, viewCount, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit base64url token, stored in plaintext (SA-16).
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        viewCount:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/ShareLinkStatus'
        createdAt:
          type: string
          format: date-time
    ShareLinkListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShareLinkResponse'
    ActiveShareLinkItem:
      allOf:
        - $ref: '#/components/schemas/ShareLinkResponse'
        - type: object
          required: [noteTitle]
          properties:
            noteTitle:
              type: string
              minLength: 1
              maxLength: 200
    ActiveShareLinkListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ActiveShareLinkItem'
    PublicSharedNote:
      type: object
      required: [title, content, updatedAt]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: '#/components/schemas/TipTapDoc'
        updatedAt:
          type: string
          format: date-time
    VersionListItem:
      type: object
      required: [versionNumber, title, createdAt]
      additionalProperties: false
      properties:
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    VersionListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VersionListItem'
    VersionDetail:
      type: object
      required: [versionNumber, title, content, createdAt]
      additionalProperties: false
      properties:
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          $ref: '#/components/schemas/TipTapDoc'
        createdAt:
          type: string
          format: date-time
    SearchResultItem:
      type: object
      required: [id, title, titleHighlight, snippet, tags, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The raw note title (plain text, not escaped).
        titleHighlight:
          type: string
          description: HTML-escaped title with every matched word wrapped in `<mark>` and `</mark>`.
        snippet:
          type: string
          description: |
            HTML-escaped fragments of the content text (up to 2, joined by
            ` … `) with matched words wrapped in `<mark>` and `</mark>`.
            The only markup in the string is `<mark>` and `</mark>`.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        updatedAt:
          type: string
          format: date-time
    SearchResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SearchResultItem'
    NoteListItem:
      type: object
      required: [id, title, preview, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        preview:
          type: string
          maxLength: 150
          description: First 150 characters of the plain text, whitespace collapsed (SDS 8.1).
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NoteListItem'
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `message`.
      enum:
        - VALIDATION_ERROR
        - MALFORMED_JSON
        - OTP_INVALID_OR_EXPIRED
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - FORBIDDEN_ORIGIN
        - ROUTE_NOT_FOUND
        - NOTE_NOT_FOUND
        - TAG_NOT_FOUND
        - VERSION_NOT_FOUND
        - SHARE_LINK_NOT_FOUND
        - EMAIL_TAKEN
        - TAG_NAME_TAKEN
        - VERSION_ALREADY_CURRENT
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the invalid field, for example `content.content.0.type`.
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Short, human-readable, safe to display. Never contains stack traces or internal detail.
            details:
              type: array
              description: Present only for VALIDATION_ERROR.
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: Value of the X-Request-Id response header.
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
  responses:
    Unauthorized:
      description: Access token missing, malformed, invalid or expired (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
              requestId: 0f6c1c3e-6f0a-4a43-9a53-2d8f4a1b7c10
    ForbiddenOrigin:
      description: The `Origin` header is present and is not the app origin (FORBIDDEN_ORIGIN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: |
        Body, query or path parameter failed validation (VALIDATION_ERROR, with
        `details`), or the request body is not parseable JSON (MALFORMED_JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: email
                  message: Invalid email address
              requestId: 0f6c1c3e-6f0a-4a43-9a53-2d8f4a1b7c10
    PayloadTooLarge:
      description: The JSON body is larger than the 1 MB limit (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body is too large
              requestId: 0f6c1c3e-6f0a-4a43-9a53-2d8f4a1b7c10
    InternalError:
      description: Unexpected failure (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShareLinkNotFound:
      description: |
        Owner: link missing or not owned. Public: unknown, revoked, expired or
        deleted-note link, indistinguishable (SHARE_LINK_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TagNotFound:
      description: Tag missing or owned by another user (TAG_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoteNotFound:
      description: Note missing, not owned, soft-deleted, or not restorable (NOTE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOTE_NOT_FOUND
              message: Note not found
              requestId: 0f6c1c3e-6f0a-4a43-9a53-2d8f4a1b7c10
